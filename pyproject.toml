[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "go-python"
dynamic = ["version"]
description = "The board game Go, for humans and bots."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.7",
    "colorama>=0.4.6",
    "pygame-ce>=2.5.8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.7.1",
    "pytest>=7.4.3",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.6.0",
    "sgfmill>=1.1.1",
    "types-colorama>=0.4.15.12",
]
release = [
    "build>=1.6.1",
    "pyinstaller>=6.22.3",
]

[project.scripts]
go-python = "go_python.cli:main"
go-python-tui = "go_python.cli:tui_main"

[tool.setuptools.dynamic]
version = {attr = "go_python.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.mypy]
files = ["src", "tests", "evals", "scripts"]
disallow_untyped_calls = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sgfmill.*", "PyInstaller.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
