name: Release

# Pushing a tag like v0.1.0 tests the code, then publishes the apps, the wheel
# and the sdist to a GitHub Release. The tag is v plus __version__. A version
# like 0.1.0rc1 makes a pre-release, which need not be on main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch, so the tag can be checked against main
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must name the version in the code
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          # go_python/__init__.py holds only the version, so the runner's
          # own Python can import it without installing anything
          PYTHONPATH: src
        run: python3 scripts/check_tag.py "$TAG" >> "$GITHUB_OUTPUT"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        # No release, pre-release or not, ships without the apps' licences
        run: |
          test -s THIRD_PARTY_LICENSES.txt
          sha256sum -- * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --generate-notes \
            --target "$GITHUB_SHA" --title "Go Python $TAG" \
            --prerelease="$PRERELEASE"
