name: Release

# Pushing a tag like v0.1.0 publishes the apps, the wheel and the sdist to a
# GitHub Release. A tag with a suffix, like v0.1.0-rc.1, makes a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag must name the version in the code
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/go_python/__init__.py)
          [ -n "$version" ] || { echo "::error::No __version__ found"; exit 1; }
          case "$TAG" in
            "v$version" | "v$version"-*) echo "Releasing $version as $TAG" ;;
            *) echo "::error::Tag $TAG does not match __version__ $version"; exit 1 ;;
          esac

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ $TAG == *-* ]]; then prerelease=true; else prerelease=false; fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes \
            --title "Go Python $TAG" --prerelease="$prerelease"
