name: Release

# Pushing a tag like v0.1.0 tests the code, then publishes the apps, the wheel
# and the sdist to a GitHub Release. The tag is v plus __version__. A version
# like 0.1.0rc1 makes a pre-release, which need not be on main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch, so the tag can be checked against main
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must name the version in the code
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/go_python/__init__.py)
          [ -n "$version" ] || { echo "::error::No __version__ found"; exit 1; }
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG must be v$version"
            exit 1
          elif [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git merge-base --is-ancestor HEAD origin/main ||
              { echo "::error::$TAG is not on main"; exit 1; }
          elif ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+rc[1-9][0-9]*$ ]]; then
            echo "::error::Version $version must be like 0.1.0, or 0.1.0rc1"
            exit 1
          fi
          echo "Releasing $version as $TAG"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ $TAG == *rc* ]]; then prerelease=true; else prerelease=false; fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes \
            --target "$GITHUB_SHA" --title "Go Python $TAG" \
            --prerelease="$prerelease"
