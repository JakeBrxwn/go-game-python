name: CI

on:
  pull_request:
  # Release runs it too, before it publishes
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -r requirements.txt
      - run: python -m pytest --cov=go_python --cov-branch
      - run: coverage report --include="*/go_python/board.py" --fail-under=100
      - run: coverage report --include="*/go_python/go.py" --fail-under=98
      - run: coverage report --include="*/go_python/match.py" --fail-under=95
      - run: coverage report --include="*/go_python/bot.py" --fail-under=95
      - run: coverage report --include="*/go_python/cli.py" --fail-under=90
      - run: coverage report --include="*/go_python/tui.py" --fail-under=90
      - run: coverage report --include="*/go_python/gui.py" --fail-under=80
      - run: coverage report --fail-under=90

  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -r requirements.txt
      - run: python -m pytest evals -s --timeout=600

  package-smoke:
    uses: ./.github/workflows/build.yml
